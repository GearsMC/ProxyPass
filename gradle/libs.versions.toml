[versions]
# GearsMC/Protocol fork sürümü (kardeş klasörden composite build ile gelir).
protocol = "1.26.30-R3-SNAPSHOT"
jackson = "3.2.2"

[libraries]
# GearsMC: NetherNet taşıması (CloudburstMC/network nethernet dalı, mavenLocal'e publishToMavenLocal ile kurulur).
netty-transport-nethernet = { group = "org.cloudburstmc.netty", name = "netty-transport-nethernet", version = "2.0.0.CR3-SNAPSHOT" }
libdatachannel = { group = "dev.opencollab", name = "libdatachannel-java", version = "0.24.5.0-SNAPSHOT" }
bedrock-codec = { group = "org.allaymc.protocol", name = "bedrock-codec", version.ref = "protocol" }

bedrock-connection = { group = "org.allaymc.protocol", name = "bedrock-connection", version.ref = "protocol" }
common = { group = "com.nukkitx", name = "common", version = "1.0.1-SNAPSHOT" }
jackson-databind = { group = "tools.jackson.core", name = "jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { group = "tools.jackson.dataformat", name = "jackson-dataformat-yaml", version.ref = "jackson" }
jansi = { group = "org.fusesource.jansi", name = "jansi", version = "2.4.3" }
jline-reader = { group = "org.jline", name = "jline-reader", version = "4.4.1" }
lombok = { group = "org.projectlombok", name = "lombok", version = "1.18.48" }
spotbugs-annotations = { group = "com.github.spotbugs", name = "spotbugs-annotations", version = "4.10.4" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
